[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-guardrail"
version = "0.1.0"
description = "Lightweight package-management guardrail for agentic coding assistants"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = " Dimensionless Developments" }]
license = { text = "MIT" }
keywords = ["guardrail", "package-manager", "llm", "supply-chain", "safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = []

[project.scripts]
pm-guardrail = "guardrail.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
